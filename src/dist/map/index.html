<!doctype html>
<html lang="en" class="vh-100">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoadSight</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="h-100">
  <div class="d-flex flex-column vh-100">

    <header>
      <div class="px-3 py-2 text-bg-dark border-bottom">
        <div class="container">
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <a href="/" class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none fw-bold">
              RoadSight
            </a>
            <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0">
              <li><a href="/" class="nav-link text-white">Home</a></li>
              <li><a href="/results/" class="nav-link text-white">Results</a></li>
              <li><a href="/retrain/" class="nav-link text-white">Retrain</a></li>
              <li><a href="/map/" class="nav-link text-secondary">Map</a></li>
            </ul>
          </div>
        </div>
      </div>
    </header>

    <div class="container py-4">
      <div class="p-3 bg-body-secondary rounded-3 shadow-sm">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
          <h3 class="fw-bold mb-0">Videos with maps</h3>
          <button type="button" class="btn btn-primary" id="show_all_maps">Show all maps</button>
        </div>
        <p class="text-secondary">Select a video to open its map in a new window.</p>
        <div class="table-responsive border rounded-3 overflow-auto bg-white">
          <table class="table table-sm table-hover mb-0" id="maps">
            <thead>
              <tr>
                <th scope="col">Video Name</th>
                <th scope="col">Upload Date</th>
                <th scope="col"></th>
              </tr>
            </thead>
            <tbody class="table-group-divider" id="map_table">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"
    integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/assets/maps.js?v=3"></script>
</body>

</html>
