<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoadSight</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <header>
    <div class="px-3 py-2 text-bg-dark border-bottom">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
          <a href="/" class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none fw-bold">
            RoadSight
          </a>
          <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0">
            <li><a href="/" class="nav-link text-secondary">Home</a></li>
            <li><a href="/results/" class="nav-link text-white">Results</a></li>
            <li><a href="/retrain/" class="nav-link text-white">Retrain</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <div class="container py-4">
    <div class="card mx-auto" style="max-width: 2000px;">
      <div class="card-body">
        <h1 class="h3">Upload</h1>
        <p class="text-secondary">Upload an image or a video to start the detection. Once the detection is complete, the
          results will be displayed below.</p>
        <div class="mb-3">
          <label class="form-label" for="imageFile">Image</label>
          <input type="file" class="form-control" id="imageFile" accept=".jpg,.jpeg,.png,.bmp,.webp,image/*">
        </div>
        <div class="mb-3">
          <label class="form-label" for="videoFile">Video</label>
          <input type="file" class="form-control" id="videoFile" accept=".mp4,.avi,.mov,.mkv,.insv,video/*">
        </div>
        <div class="mb-3">
          <label class="form-label" for="gpxFile"> Optional GPS track for the video (.gpx)</label>
          <input type="file" class="form-control" id="gpxFile" accept=".gpx">
        </div>
      </div>
    </div>

    <div id="job_banner" class="card mx-auto mt-4" style="max-width: 860px;" hidden>
      <div class="card-body">
        <p id="job_label" class="fw-semibold mb-2">Uploading…</p>
        <div class="progress mb-3" role="progressbar" aria-label="Detection progress" aria-valuenow="0"
          aria-valuemin="0" aria-valuemax="100" id="job_progress">
          <div class="progress-bar progress-bar-striped progress-bar-animated" id="job_bar" style="width: 34%">
            Uploading…</div>
        </div>
        <p id="job_detail" class="mb-0 text-secondary"></p>
        <video id="job_video" class="w-100 rounded mt-3" controls
          style="max-height: 480px; background: #111; display: none;"></video>
        <img id="job_image" class="img-fluid rounded mt-3" alt="Detected result"
          style="max-height: 480px; display: none;">
        <p id="job_media_message" class="text-secondary mb-0 mt-2" hidden></p>
      </div>
    </div>
  </div>

  <script src="/assets/job.js?v=6"></script>
  <script src="/assets/upload.js?v=5"></script>
</body>

</html>
