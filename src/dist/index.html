<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoadSight</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <header>
    <div class="px-3 py-2 text-bg-dark border-bottom">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
          <a href="/" class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
            <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap">
              <use xlink:href="#bootstrap"></use>
            </svg>
          </a>
          <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small">
            <li>
              <a href="/" class="nav-link text-secondary">
                <svg class="bi d-block mx-auto mb-1" width="24" height="24" aria-hidden="true">
                  <use xlink:href="#home"></use>
                </svg>
                Home
              </a>
            </li>
            <li>
              <a href="/detections" class="nav-link text-white">
                <svg class="bi d-block mx-auto mb-1" width="24" height="24" aria-hidden="true">
                  <use xlink:href="#table"></use>
                </svg>
                Detections
              </a>
            </li>
            <li>
              <a href="/preview" class="nav-link text-white">
                <svg class="bi d-block mx-auto mb-1" width="24" height="24" aria-hidden="true">
                  <use xlink:href="#speedometer2"></use>
                </svg>
                Preview
              </a>
            </li>
            <li>
              <a href="/map" class="nav-link text-white">
                <svg class="bi d-block mx-auto mb-1" width="24" height="24" aria-hidden="true">
                  <use xlink:href="#grid"></use>
                </svg>
                Map
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <div class="divider"></div>
  <div class="d-flex flex-column flex-md-row p-4 gap-4 py-md-5 align-items-center justify-content-center">
    <div class="card w-75">
      <div class="card-body w-auto">
        <div class="input-group mb-3">
          <input type="file" class="form-control" id="inputGroupFile02" multiple>
          <label class="input-group-text" for="inputGroupFile02">Upload</label>
        </div>
      </div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="d-flex flex-column flex-md-row p-4 gap-4 py-md-5 align-items-center justify-content-center">
    <div class="card w-75">
      <div class="card-body w-auto">
        <h1>Items Left in Queue: 0</h1>
        <div class="progress" role="progressbar" aria-label="Animated striped example" aria-valuenow="0"
          aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex flex-column flex-md-row p-4 gap-4 py-md-5 align-items-center justify-content-center">
    <div class="card w-75">
      <div class="card-body w-auto">
        <table class="table table-hover selectable-table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Filename</th>
              <th scope="col">Upload Date</th>
              <th scope="col">File Size</th>
              <th scope="col">
                <input class="form-check-input row-checkbox" type="checkbox" id="selectAll">
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td scope="row">1</td>
              <td>2026-09-23 00-09-18.mp4</td>
              <td>20/10/2026</td>
              <td>122.94MB</td>
              <td>
                <input class="form-check-input row-checkbox" type="checkbox">
              </td>
            </tr>
            <tr>
              <td scope="row">2</td>
              <td>2026-09-23 00-57-07.mp4</td>
              <td>20/10/2026</td>
              <td>131.59MB</td>
              <td>
                <input class="form-check-input row-checkbox" type="checkbox">
              </td>
            </tr>
            <tr class="table-secondary">
              <td scope="row"></td>
              <td></td>
              <td></td>
              <td></td>
              <td>
                <input class="form-check-input row-checkbox" type="checkbox">
              </td>
            </tr>
          </tbody>
        </table>
        <div class="d-flex justify-content-end">
          <button type="button" class="btn btn-primary btn-large">Reprocess Selected</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CDN imports for bootstrap (for page styling) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>
</body>

</html>
